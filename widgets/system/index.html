<!doctype html><meta charset="utf-8"><title>hikari - system</title><link rel="stylesheet" href="../theme.css">
<!-- Under the host these come from the preload bridge. In a browser the mock stands in,
     and it needs the shared config module to read the query string. -->
<script>if(!window.hikari)document.write('<script src="../../src/lib/config.js"><\/script><script src="../../preview/mock-hikari.js"><\/script>')</script>
<style>
  .panel { padding: 12px 14px; display: grid; align-content: start; gap: 9px; }
  .row { display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 8px; }
  .row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* A volume is a name, not a label, so it keeps the case its owner gave it. Uppercasing
     "Archive" also costs about a fifth of its width in letter-spacing, which is the
     difference between the name fitting and the row reading "AR...". */
  .row .label.name { text-transform: none; letter-spacing: 0; }
  .bar { height: 5px; border-radius: 3px; background: rgba(255,255,255,.09); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width .45s ease; }
  .bar.hot i { background: linear-gradient(90deg, var(--accent), #ff2d55); }
  /* Charging is the one state worth its own colour. A battery going up and a battery going
     down are the same bar at the same width, and the difference is what you act on. */
  .bar.charging i { background: linear-gradient(90deg, var(--accent-2), #4dffa6); }
  .v { text-align: right; font-variant-numeric: tabular-nums; font-size: 11.5px; }
  .v small { color: var(--dim); font-size: 10px; margin-left: 4px; }

  /* Unknown has to look different from a reading, not like a reading of nothing. A row with
     nothing to draw loses its bar entirely rather than drawing an empty one, because an
     empty bar is a bar at 0% and that is the one thing it must not say. */
  /* One line, with an ellipsis rather than a wrap. A reason that grew to three lines would
     push every row below it down and the last one out of a window whose height is fixed in
     the manifest, so a long message would cost you the reading it was explaining. */
  .note { grid-column: 2 / 4; color: var(--dim); font-size: 10.5px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .note.warn { color: var(--warn); }
  /* A stale reading is shown, and marked. Hiding it would be worse; showing it unmarked
     would be a lie. */
  .stale .v, .stale .bar { opacity: .5; }
  .net { display: flex; gap: 6px; align-items: baseline; margin-top: 2px; }
  .net .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex: none; }
  .net .dot.up { background: #4dffa6; }
  .net .dot.down { background: var(--warn); }
  .net .who { color: var(--fg); font-size: 11px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .net .who.warn { color: var(--warn); }
</style>
<div class="panel" id="panel">
  <div class="row"><span class="label">sys</span><span class="note">Waiting for the first reading.</span></div>
</div>
<script>
(() => {
  const panel = document.getElementById("panel");
  window.hikari.onConfigChange?.(() => location.reload());

  /** Reason strings come from the OS and from a config file, so they are escaped before
   *  they are written as HTML. A path is allowed to contain a less-than sign. */
  const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");

  /**
   * Bytes, in binary multiples.
   *
   * The same units `df -h` and every Windows and Linux disk tool use. macOS's Finder counts
   * in decimal, so a figure here reads a few percent lower than the same volume does there.
   * That is a units difference and not an error, and picking the majority convention beats
   * matching one platform and disagreeing with the other two.
   */
  function bytes(n) {
    if (n === null || n === undefined) return null;
    const units = ["B", "KB", "MB", "GB", "TB", "PB"];
    let v = n, i = 0;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return `${v >= 100 || i === 0 ? Math.round(v) : v.toFixed(1)}${units[i]}`;
  }

  /** Minutes as the roughest form that is still true. Null in, nothing out. */
  function duration(mins) {
    if (mins === null || mins === undefined) return null;
    if (mins < 60) return `${mins}m`;
    return `${Math.floor(mins / 60)}h ${String(mins % 60).padStart(2, "0")}m`;
  }

  /** How old, in the roughest terms that are still true. */
  function ago(ms) {
    const mins = Math.floor(ms / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins} min old`;
    const hours = Math.floor(mins / 60);
    return `${hours} hour${hours === 1 ? "" : "s"} old`;
  }

  /**
   * The rows, built once per shape and then updated in place.
   *
   * Rebuilding `innerHTML` on every snapshot was the first version and it looked broken: the
   * bars have a width transition, and replacing the element restarts it from zero every
   * second, so nothing ever finishes moving. The skeleton is rebuilt only when the set of
   * row keys changes, which is when a volume is added or removed from the config.
   */
  let keys = "";
  const rows = new Map();

  function build(spec) {
    const signature = spec.map((r) => r.key).join("|");
    if (signature === keys) return;
    keys = signature;
    rows.clear();
    panel.innerHTML = "";
    for (const r of spec) {
      const row = document.createElement("div");
      row.className = r.key === "net" ? "net" : "row";
      panel.appendChild(row);
      rows.set(r.key, row);
    }
  }

  /** One bar row: a label, a bar, a value. */
  function bar(row, label, pct, opts) {
    const hot = pct !== null && pct >= (opts?.hotAt ?? 85);
    row.className = `row${opts?.stale ? " stale" : ""}`;
    row.innerHTML =
      `<span class="label${opts?.name ? " name" : ""}">${esc(label)}</span>` +
      `<span class="bar${hot ? " hot" : ""}${opts?.charging ? " charging" : ""}"><i style="width:${pct === null ? 0 : Math.min(100, Math.max(0, pct))}%"></i></span>` +
      `<span class="v">${pct === null ? "--" : Math.round(pct) + "%"}` +
      `${opts?.suffix ? `<small>${esc(opts.suffix)}</small>` : ""}</span>`;
  }

  /** One row with a sentence instead of a bar, for a reading that does not exist. */
  function note(row, label, text, warn, name) {
    row.className = "row";
    row.innerHTML =
      `<span class="label${name ? " name" : ""}">${esc(label)}</span>` +
      `<span class="note${warn ? " warn" : ""}">${esc(text)}</span>`;
  }

  /** Which rows this snapshot needs. Volume rows come and go with the config. */
  function shapeOf(s) {
    const spec = [{ key: "cpu" }, { key: "ram" }];
    const d = s.disk;
    if (d && d.available === true && d.volumes.length > 0) {
      d.volumes.forEach((v, i) => spec.push({ key: `disk:${i}` }));
    } else {
      spec.push({ key: "disk:0" });
    }
    spec.push({ key: "bat" }, { key: "net" });
    return spec;
  }

  function renderDisk(s) {
    const d = s.disk;
    if (!d || d.available !== true) {
      note(rows.get("disk:0"), "disk", d?.reason ?? "no reading yet", Boolean(d?.reason));
      return;
    }
    if (d.volumes.length === 0) {
      note(rows.get("disk:0"), "disk", "no paths to measure", true);
      return;
    }
    d.volumes.forEach((v, i) => {
      const row = rows.get(`disk:${i}`);
      if (!row) return;
      if (v.error) { note(row, v.label ?? "disk", v.error, true, true); return; }
      // The free figure, not the used one. "82%" answers a question nobody asks; the
      // question is whether the next thing you copy will fit.
      bar(row, v.label ?? "disk", v.usage, { name: true, suffix: bytes(v.free) ? `${bytes(v.free)} free` : null });
    });
  }

  function renderBattery(s) {
    const row = rows.get("bat");
    const b = s.battery;
    if (!b || b.available !== true) {
      note(row, "bat", b?.reason ?? "no reading yet", Boolean(b?.reason));
      return;
    }
    // The distinction the whole provider exists for. A desktop has no battery, and the
    // number a naive read gives one is 0%, which is a full red bar on a machine that cannot
    // run out of power.
    if (b.installed === false) { note(row, "bat", "no battery", false); return; }

    const suffix = b.state === "charged"
      ? "charged"
      : duration(b.minutesRemaining) ?? (b.charging === true ? "charging" : b.plugged === true ? "on mains" : null);
    bar(row, "bat", b.percent, {
      charging: b.charging === true,
      // A battery is the one bar where low is the warning, so the threshold is inverted
      // rather than shared with cpu and disk. On mains it is not a warning at all.
      hotAt: 101,
      stale: b.freshness === "stale",
      suffix: b.freshness === "stale" ? ago(Date.now() - b.takenAt) : suffix,
    });
    if (b.percent !== null && b.percent <= 15 && b.charging !== true) {
      row.querySelector(".bar").classList.add("hot");
    }
  }

  function renderNetwork(s) {
    const row = rows.get("net");
    const n = s.network;
    if (!n || n.available !== true) {
      note(row, "net", n?.reason ?? "no reading yet", Boolean(n?.reason));
      return;
    }
    row.className = "net";
    // "up" says the machine holds an address that could carry traffic, which is all the
    // provider measures. The wording stays at that strength on purpose: no packet was sent,
    // so "connected" would be a claim about a router this widget never spoke to.
    const who = n.up ? `${esc(n.name)} &middot; ${esc(n.address)}` : "no routable address";
    row.innerHTML =
      `<span class="dot ${n.up ? "up" : "down"}"></span>` +
      `<span class="who${n.up ? "" : " warn"}">${who}</span>`;
    // Throughput is deliberately absent rather than shown as `--`. The provider reports it
    // as unknown on every platform, and a dash that can never fill in reads as a broken
    // widget instead of as a measurement nobody takes. The reason is in src/lib/network.js.
  }

  function render(s) {
    build(shapeOf(s));
    bar(rows.get("cpu"), "cpu", s.cpu?.usage ?? null);
    bar(rows.get("ram"), "ram", s.memory?.usage ?? null, {
      suffix: s.memory?.free ? `${bytes(s.memory.free)} free` : null,
    });
    renderDisk(s);
    renderBattery(s);
    renderNetwork(s);
  }

  window.hikari.subscribe(render);
})();
</script>
