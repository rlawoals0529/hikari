<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../theme.css">
<!-- Under the host these come from the preload bridge. In a browser the mock stands in,
     and it needs the shared config module to read the query string. -->
<script>if(!window.hikari)document.write('<script src="../../src/lib/config.js"><\/script><script src="../../preview/mock-hikari.js"><\/script>')</script>
<style>
  /* nowrap is load-bearing, not tidiness. The space in "10:25 PM" is a wrap opportunity, and
     at 40px the 12-hour time plus the seconds came to 239px inside a 230px widget, so "PM"
     dropped to a second line and the panel clipped it. The manifest is wide enough now; this
     stops a longer locale doing the same thing again. */
  .time { font-size: 40px; font-weight: 300; letter-spacing: 1px; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
  /* --accent-text, not --accent: the accent is a fill colour, and as 17px words over a
     translucent panel on a light wallpaper it measured 4.06:1. */
  .time .sec { font-size: 17px; color: var(--accent-text, var(--accent)); margin-left: 4px; }
  .sub { margin-top: 7px; display: flex; gap: 8px; align-items: baseline; }
  .sub .day { color: var(--accent-2); }
</style>
<div class="panel">
  <div class="time"><span id="t">--:--</span><span class="sec" id="s"></span></div>
  <div class="sub"><span class="day" id="d"></span><span class="label" id="dt"></span></div>
</div>
<script>
  window.hikari.subscribe((state) => {
    const d = state.date; if (!d) return;
    document.getElementById("t").textContent = d.time;
    document.getElementById("s").textContent = String(d.seconds).padStart(2, "0");
    document.getElementById("d").textContent = d.day;
    document.getElementById("dt").textContent = d.date;
  });
</script>
