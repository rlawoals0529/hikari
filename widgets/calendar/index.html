<!doctype html>
<meta charset="utf-8">
<title>hikari - calendar</title>
<!-- Under the host these come from the preload bridge. In a browser the mock stands in,
     and it needs the shared config module to read the query string. -->
<script>if(!window.hikari)document.write('<script src="../../src/lib/config.js"><\/script><script src="../../preview/mock-hikari.js"><\/script>')</script>
<link rel="stylesheet" href="../theme.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
  #card {
    height: 100%; box-sizing: border-box;
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 9px;
    background: var(--panel); border: 1px solid var(--edge); border-radius: inherit;
    backdrop-filter: blur(18px);
    font: 12px/1.4 var(--font-body);
    color: var(--fg);
  }
  .head { color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em;
          display: flex; justify-content: space-between; gap: 8px; }

  /* No scrollbar, because a scrollbar on a click-through desktop overlay is a thing nobody
     can reach with the mouse. The overflow rule is the safety net rather than the plan:
     `fill` below renders only the rows that fit, so there is nothing here to clip. */
  .list { display: grid; gap: 7px; align-content: start; overflow: hidden; }
  .day { color: var(--dim); font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
         margin-top: 2px; }
  .day:first-child { margin-top: 0; }
  .ev { display: grid; grid-template-columns: 52px 1fr; gap: 9px; align-items: baseline; }
  /* Tabular figures so a column of times lines up, and a fixed column so the titles do. */
  .at { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* All-day is not a time, so it does not get to look like one. */
  .at.allday { text-transform: lowercase; letter-spacing: .02em; }
  /* --accent-text, not --accent: as words over a translucent panel on a light wallpaper the
     accent measured 4.06:1, and "now" is the one entry you are looking for. */
  .at.live { color: var(--accent-text, var(--accent)); }
  .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .where { color: var(--dim); }
  .more { color: var(--dim); font-size: 10.5px; }

  /* Unknown has to look different from a reading, not like a reading of nothing. */
  .unknown { color: var(--dim); font-size: 12px; line-height: 1.55; }
  .unknown b { color: var(--warn); font-weight: 600; }
  /* A stale feed is shown, and marked. Hiding it would be worse; showing it unmarked would
     be a lie about a list that may be missing a cancellation. */
  .stale .list { opacity: .55; }
  .age { color: var(--warn); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
</style>
<div id="card"><div class="unknown">Waiting for the first read.</div></div>
<script>
(async () => {
  const cfg = (await window.hikari.config()) ?? {};
  const card = document.getElementById("card");
  window.hikari.onConfigChange?.(() => location.reload());

  /** How many rows fit. More than this and the widget is a list nobody reads off a desktop. */
  const count = Number.isFinite(cfg.count) && cfg.count > 0 ? Math.floor(cfg.count) : 4;

  /**
   * Everything from the feed goes through this before it goes near innerHTML.
   *
   * A summary, a location and an error message are all written by whoever publishes the
   * calendar you subscribed to, which is not necessarily you. An unescaped title is a
   * script tag on your desktop, in a window with a preload bridge attached to it.
   */
  const esc = (v) =>
    String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  const time = (ms) => new Date(ms).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });

  /** How old, in the roughest terms that are still true. */
  function ago(ms) {
    const mins = Math.floor(ms / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins} min old`;
    const hours = Math.floor(mins / 60);
    return `${hours} hour${hours === 1 ? "" : "s"} old`;
  }

  /**
   * Which day a start falls on, relative to today, in words where words are clearer.
   *
   * Compared by local calendar day rather than by a difference in hours: an event nine
   * hours away is tomorrow if it is after midnight and today if it is not, and "in 9 hours"
   * is not what a person wants to read off a wall.
   */
  function dayName(ms, now) {
    const at = new Date(ms);
    const midnight = new Date(now);
    midnight.setHours(0, 0, 0, 0);
    const days = Math.floor((at - midnight) / 86400000);
    if (days <= 0) return "today";
    if (days === 1) return "tomorrow";
    return at.toLocaleDateString([], { weekday: "short", day: "numeric", month: "short" });
  }

  function rows(events, now, shown) {
    const out = [];
    let day = null;
    for (const e of events.slice(0, shown)) {
      const name = dayName(e.start, now);
      // A day heading only where the day changes, so a run of meetings reads as one block
      // rather than as the same date repeated four times.
      if (name !== day) {
        out.push(`<div class="day">${esc(name)}</div>`);
        day = name;
      }
      const live = e.start <= now && Number.isFinite(e.end) && e.end > now;
      const at = e.allDay
        ? '<span class="at allday">all day</span>'
        : `<span class="at${live ? " live" : ""}">${live ? "now" : esc(time(e.start))}</span>`;
      const title = e.summary === null || e.summary === undefined ? "untitled" : e.summary;
      out.push(
        `<div class="ev">${at}<span class="what" title="${esc(title)}">${esc(title)}` +
          (e.location ? ` <span class="where">&middot; ${esc(e.location)}</span>` : "") +
          "</span></div>",
      );
    }
    const hidden = events.length - shown;
    if (hidden > 0) out.push(`<div class="more">+${hidden} more</div>`);
    return out.join("");
  }

  /**
   * Render the most rows that actually fit, which is not the same as the number asked for.
   *
   * The list is clipped by `overflow: hidden`, and clipping is silent: at the declared
   * height four events across three days overflowed by 47 pixels, so the widget hid a row
   * *and* said "+1 more" while two were missing. A day heading is a whole row of its own and
   * how many there are depends on the events, so no height and count can be paired up in
   * advance. Measuring is the only honest answer, and it makes `count` a maximum rather
   * than a promise.
   */
  function fill(list, events, now) {
    let shown = Math.min(count, events.length);
    for (;;) {
      list.innerHTML = rows(events, now, shown);
      // One row always renders. Below that there is nothing left to give up, and looping
      // to zero would leave the widget blank with events to show.
      if (shown <= 1 || list.scrollHeight <= list.clientHeight) return;
      shown--;
    }
  }

  function render(c) {
    // No read, or one too old to claim the list is complete. The reason is shown rather
    // than an empty list, because an empty list is a claim about your week and this is an
    // admission about the widget, and "set a url" and "the network is down" need different
    // responses from you.
    if (!c || c.available !== true) {
      card.className = "";
      card.innerHTML =
        '<div class="unknown"><b>No calendar.</b><br>' +
        esc(c && c.reason ? c.reason : "The calendar provider has not reported yet.") +
        "</div>";
      return;
    }

    const now = Date.now();
    const events = Array.isArray(c.events) ? c.events : [];
    const days = Number.isFinite(c.days) ? c.days : 7;
    card.className = c.freshness === "stale" ? "stale" : "";

    const head =
      `<div class="head"><span>${esc(cfg.label ?? "next " + days + (days === 1 ? " day" : " days"))}</span>` +
      (c.freshness === "stale" && Number.isFinite(c.takenAt)
        ? `<span class="age">${esc(ago(now - c.takenAt))}</span>`
        : "") +
      "</div>";

    // Two empty states, and they are not the same thing. A feed with no events at all is a
    // calendar to fix; a feed whose events are simply further out than the window is a
    // clear week. Both render as no rows, and telling a reader which one it is costs a
    // sentence.
    if (events.length === 0) {
      card.innerHTML =
        head +
        '<div class="unknown">' +
        (c.total === 0
          ? "This calendar has no events in it."
          : `Nothing in the next ${esc(days)} ${days === 1 ? "day" : "days"}.`) +
        "</div>";
      return;
    }

    card.innerHTML = head + '<div class="list"></div>';
    fill(card.querySelector(".list"), events, now);
  }

  window.hikari.subscribe((state) => render(state.calendar));
})();
</script>
