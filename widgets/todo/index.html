<!doctype html>
<meta charset="utf-8">
<title>hikari - todo</title>
<!-- Under the host these come from the preload bridge. In a browser the mock stands in,
     and it needs the shared config module to read the query string. -->
<script>if(!window.hikari)document.write('<script src="../../src/lib/config.js"><\/script><script src="../../preview/mock-hikari.js"><\/script>')</script>
<script src="../../src/lib/todo.js"></script>
<link rel="stylesheet" href="../theme.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent; }
  #card {
    height: 100%; box-sizing: border-box; padding: 14px 16px;
    display: grid; grid-template-rows: auto 1fr auto; gap: 10px;
    background: var(--panel); border: 1px solid var(--edge); border-radius: inherit;
    backdrop-filter: blur(18px);
    font: 12.5px/1.45 var(--font-body, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif);
    color: var(--fg);
  }
  .head { display: flex; align-items: baseline; gap: 8px;
          color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .head .count { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0; }

  /* The input is a line, not a box. One bordered card is enough for a widget this size, and
     a field inside a card inside a panel is three frames for one text input. */
  input[type=text] {
    width: 100%; box-sizing: border-box;
    background: none; border: 0; border-bottom: 1px solid var(--edge);
    color: var(--fg); font: inherit; padding: 5px 1px 6px;
  }
  input[type=text]:focus { outline: 0; border-bottom-color: var(--accent); }
  input[type=text]::placeholder { color: var(--dim); opacity: .75; }

  ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; }
  li { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; }

  /* The whole row is the hit area. A 13px circle is not a target, and this widget is used
     with a mouse on a desktop rather than by anyone taking careful aim. */
  li button.tick {
    flex: 0 0 auto; width: 15px; height: 15px; margin-top: 2px; padding: 0;
    border: 1.5px solid var(--edge); border-radius: 50%;
    background: none; cursor: pointer;
    transition: border-color 140ms ease-out, background-color 140ms ease-out;
  }
  li button.tick:hover { border-color: var(--accent); }
  li.done button.tick { background: var(--accent-2); border-color: var(--accent-2); }
  li .text { flex: 1 1 auto; cursor: pointer; word-break: break-word; }
  li.done .text { color: var(--dim); text-decoration: line-through; text-decoration-thickness: 1px; }

  /* Removal appears on hover only. A row of visible delete buttons on a list you look at all
     day is an invitation to lose something. */
  li button.gone {
    flex: 0 0 auto; opacity: 0; background: none; border: 0; padding: 0 2px;
    color: var(--dim); cursor: pointer; font-size: 14px; line-height: 1;
    transition: opacity 140ms ease-out, color 140ms ease-out;
  }
  li:hover button.gone { opacity: 1; }
  li button.gone:hover { color: var(--err, #ff6b6b); }

  .foot { display: flex; align-items: baseline; }
  .foot button {
    background: none; border: 0; padding: 4px 0; color: var(--dim);
    font: inherit; font-size: 11px; cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: color 140ms ease-out, border-color 140ms ease-out;
  }
  .foot button:hover { color: var(--fg); border-bottom-color: var(--edge); }
  .empty { color: var(--dim); font-size: 12px; line-height: 1.6; }
  .broken { color: var(--err, #ff6b6b); font-size: 11.5px; line-height: 1.55; }
</style>
<div id="card">
  <div class="head"><span>To do</span><span class="count" id="count"></span></div>
  <div>
    <input type="text" id="entry" placeholder="Add something" maxlength="200"
           autocomplete="off" spellcheck="false" aria-label="Add something to do">
    <ul id="list"></ul>
  </div>
  <div class="foot" id="foot"></div>
</div>
<script>
(async () => {
  const { normalise, add, toggle, remove, clearDone, view } = window.hikariTodo;
  const cfg = (await window.hikari.config()) ?? {};
  window.hikari.onConfigChange?.(() => location.reload());

  const card = document.getElementById("card");
  const listEl = document.getElementById("list");
  const countEl = document.getElementById("count");
  const footEl = document.getElementById("foot");
  const entry = document.getElementById("entry");

  let list = [];

  /**
   * Say so, rather than starting empty and silently discarding the file.
   *
   * The one failure this widget must not have is looking like an empty list when the list is
   * actually on disk and unreadable, because the next thing that happens is a write that
   * replaces it.
   */
  let broken = null;
  let writable = true;

  async function load() {
    try {
      list = normalise(await window.hikari.store.get());
    } catch (e) {
      broken = e.message;
      writable = false;
    }
  }

  /** Persist, and stop pretending the list is saved if it is not. */
  async function save() {
    if (!writable) return;
    try {
      await window.hikari.store.set({ items: list });
    } catch (e) {
      broken = e.message;
      writable = false;
      render();
    }
  }

  function render() {
    const v = view(list);
    countEl.textContent = v.total === 0 ? "" : `${v.open} of ${v.total}`;

    listEl.replaceChildren();
    for (const item of v.items) {
      const li = document.createElement("li");
      if (item.done) li.className = "done";

      const tick = document.createElement("button");
      tick.type = "button";
      tick.className = "tick";
      tick.setAttribute("aria-pressed", String(item.done));
      tick.setAttribute("aria-label", item.done ? `Mark ${item.text} as not done` : `Mark ${item.text} as done`);

      const text = document.createElement("span");
      text.className = "text";
      // textContent, never innerHTML. The text came off disk and out of an input, and a
      // task called <img src=x onerror=...> is a thing somebody can type.
      text.textContent = item.text;

      const gone = document.createElement("button");
      gone.type = "button";
      gone.className = "gone";
      gone.textContent = "×";
      gone.setAttribute("aria-label", `Remove ${item.text}`);

      const flip = async () => { list = toggle(list, item.id); render(); await save(); };
      tick.addEventListener("click", flip);
      text.addEventListener("click", flip);
      gone.addEventListener("click", async () => { list = remove(list, item.id); render(); await save(); });

      li.append(tick, text, gone);
      listEl.appendChild(li);
    }

    footEl.replaceChildren();
    if (broken) {
      const p = document.createElement("div");
      p.className = "broken";
      p.textContent = `Not saving: ${broken}`;
      footEl.appendChild(p);
    } else if (v.total === 0) {
      const p = document.createElement("div");
      p.className = "empty";
      p.textContent = "Nothing yet.";
      footEl.appendChild(p);
    } else if (v.done > 0) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = `Clear ${v.done} done`;
      b.addEventListener("click", async () => { list = clearDone(list); render(); await save(); });
      footEl.appendChild(b);
    }
  }

  entry.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const text = entry.value;
    // The id is minted here and passed in, so the list operations stay pure and a test can
    // name an id rather than match a shape.
    list = add(list, text, `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`, Date.now());
    entry.value = "";
    render();
    await save();
  });

  await load();
  render();
})();
</script>
