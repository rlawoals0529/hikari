name: Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    # Pages cannot be enabled on a private repository, so until this one is public the
    # deploy can only fail, and a permanently red run trains you to ignore the colour.
    # A manual dispatch always runs, so there is still a way to see the real error.
    if: github.event_name == 'workflow_dispatch' || github.event.repository.private == false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deploy
        uses: actions/deploy-pages@v4
